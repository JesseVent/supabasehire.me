<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card">
  <div class="col" style="gap:8px">
    <div class="label">Spacing tokens · 0 → 96px</div>
    <div class="col" style="gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--agl-fg-muted)">
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-1 · 4</span><span style="display:inline-block;height:10px;width:4px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-2 · 8</span><span style="display:inline-block;height:10px;width:8px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-3 · 12</span><span style="display:inline-block;height:10px;width:12px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-4 · 16</span><span style="display:inline-block;height:10px;width:16px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-5 · 24</span><span style="display:inline-block;height:10px;width:24px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-6 · 36</span><span style="display:inline-block;height:10px;width:36px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-7 · 48</span><span style="display:inline-block;height:10px;width:48px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-8 · 60</span><span style="display:inline-block;height:10px;width:60px;background:var(--agl-accent)"></span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:90px">--space-9 · 96</span><span style="display:inline-block;height:10px;width:96px;background:var(--agl-accent)"></span></div>
    </div>
  </div>
</body>
</html>
