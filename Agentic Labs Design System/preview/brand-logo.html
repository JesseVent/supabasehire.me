<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card">
  <div class="row" style="gap:32px;align-items:center;justify-content:space-around">
    <div class="col" style="gap:6px;align-items:center">
      <img src="../assets/agentic-labs-logo.svg" height="36" alt="Agentic Labs lockup" style="color:var(--agl-fg)">
      <span class="label">lockup · light</span>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <img src="../assets/agentic-labs-mark.svg" height="48" alt="Agentic Labs mark" style="color:var(--agl-fg)">
      <span class="label">mark · 32×32</span>
    </div>
    <div class="col" style="gap:6px;align-items:center;background:var(--slate-950);padding:16px 22px;border-radius:var(--radius-md);color:#fff">
      <img src="../assets/agentic-labs-logo.svg" height="36" alt="" style="color:#fff;filter:invert(1)">
      <span class="label" style="color:var(--slate-300)">lockup · dark</span>
    </div>
  </div>
</body>
</html>
