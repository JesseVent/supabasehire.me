<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Brand accent scale</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card">
  <div class="col" style="gap:8px">
    <div class="label">Blue · accent scale · @evilmartians/harmony OKLCH</div>
    <div class="row" style="gap:6px">
      <div class="swatch swatch-sm" style="background:var(--blue-50)"><span class="swatch-token" style="color:var(--blue-900)">50</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-100)"><span class="swatch-token" style="color:var(--blue-900)">100</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-200)"><span class="swatch-token" style="color:var(--blue-900)">200</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-300)"><span class="swatch-token" style="color:var(--blue-900)">300</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-400)"><span class="swatch-token" style="color:var(--blue-950)">400</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-500)"><span class="swatch-token" style="color:#fff">500</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-600);outline:2px solid var(--agl-fg);outline-offset:2px"><span class="swatch-token" style="color:#fff">600 ★</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-700)"><span class="swatch-token" style="color:#fff">700</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-800)"><span class="swatch-token" style="color:#fff">800</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-900)"><span class="swatch-token" style="color:var(--blue-100)">900</span></div>
      <div class="swatch swatch-sm" style="background:var(--blue-950)"><span class="swatch-token" style="color:var(--blue-100)">950</span></div>
    </div>
    <p style="margin:8px 0 0;font-size:12px;color:var(--agl-fg-muted);font-family:var(--font-mono)">★ <code style="background:none;padding:0;color:var(--agl-fg)">--agl-accent = --blue-600</code></p>
  </div>
</body>
</html>
