<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_preview.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  .ico { width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--agl-fg-muted);font-size:18px; }
  .ico svg { width:20px;height:20px; }
</style></head>
<body class="card">
  <div class="col" style="gap:14px">
    <div>
      <div class="label" style="margin-bottom:6px">Marketing · Font Awesome 6 free</div>
      <div class="row" style="gap:4px">
        <div class="ico"><i class="fa-brands fa-github"></i></div>
        <div class="ico"><i class="fa-brands fa-x-twitter"></i></div>
        <div class="ico"><i class="fa-brands fa-linkedin"></i></div>
        <div class="ico"><i class="fa-regular fa-gem"></i></div>
        <div class="ico"><i class="fa-solid fa-heart"></i></div>
        <div class="ico"><i class="fa-regular fa-star"></i></div>
        <div class="ico"><i class="fa-solid fa-bars"></i></div>
        <div class="ico"><i class="fa-solid fa-chevron-down"></i></div>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px">Product · Lucide React (inline SVG)</div>
      <div class="row" style="gap:4px">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px">Unicode arrows · used in nav + flows</div>
      <div class="row" style="gap:18px;font-family:var(--font-display);font-size:24px;font-stretch:80%;color:var(--agl-fg)">↗ → ← ↑ ↓ ⌘ ⏎ ⚠</div>
    </div>
  </div>
</body>
</html>
