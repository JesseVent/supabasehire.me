<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slate neutrals</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card">
  <div class="col" style="gap:8px">
    <div class="label">Slate · neutral scale · text + surfaces + borders</div>
    <div class="row" style="gap:6px">
      <div class="swatch swatch-sm" style="background:var(--slate-50)"><span class="swatch-token" style="color:var(--slate-900)">50</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-100)"><span class="swatch-token" style="color:var(--slate-900)">100</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-200)"><span class="swatch-token" style="color:var(--slate-900)">200</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-300)"><span class="swatch-token" style="color:var(--slate-900)">300</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-400)"><span class="swatch-token" style="color:var(--slate-950)">400</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-500)"><span class="swatch-token" style="color:#fff">500</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-600)"><span class="swatch-token" style="color:#fff">600</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-700)"><span class="swatch-token" style="color:#fff">700</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-800)"><span class="swatch-token" style="color:#fff">800</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-900)"><span class="swatch-token" style="color:var(--slate-100)">900</span></div>
      <div class="swatch swatch-sm" style="background:var(--slate-950)"><span class="swatch-token" style="color:var(--slate-100)">950</span></div>
    </div>
  </div>
</body>
</html>
