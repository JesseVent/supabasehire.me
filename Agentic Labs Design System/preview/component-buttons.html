<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_preview.css">
<style>
  .btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-family:var(--font-sans);font-weight:500;cursor:pointer;transition:opacity var(--dur-fast) var(--ease-out),background var(--dur-base) var(--ease-out);text-decoration:none; }
  .btn-md { height:40px;padding:0 16px;border-radius:var(--radius-md);font-size:14px; }
  .btn-sm { height:32px;padding:0 12px;border-radius:var(--radius-sm);font-size:13px; }
  .btn-primary { background:var(--agl-accent);color:var(--agl-on-accent); }
  .btn-primary:hover { opacity:0.7; }
  .btn-secondary { background:var(--agl-accent-soft);color:var(--agl-accent); }
  .btn-secondary:hover { background:var(--agl-accent-soft-hover); }
  .btn-tertiary { background:transparent;color:var(--agl-fg-muted);box-shadow:inset 0 0 0 1px var(--agl-border-strong); }
  .btn-tertiary:hover { background:var(--agl-surface);color:var(--agl-fg); }
  .btn-ghost { background:transparent;color:var(--agl-fg); }
  .btn-ghost:hover { background:var(--agl-surface); }
  .btn-disabled { opacity:0.5;cursor:not-allowed; }
</style></head>
<body class="card">
  <div class="col" style="gap:12px">
    <div class="label">Buttons · medium</div>
    <div class="row" style="gap:10px">
      <button class="btn btn-md btn-primary">Sign Up</button>
      <button class="btn btn-md btn-secondary">Request a Demo</button>
      <button class="btn btn-md btn-tertiary">Sign In</button>
      <button class="btn btn-md btn-ghost">Cancel</button>
      <button class="btn btn-md btn-primary btn-disabled" disabled>Disabled</button>
    </div>
    <div class="label" style="margin-top:6px">Compact · small</div>
    <div class="row" style="gap:10px">
      <button class="btn btn-sm btn-primary">Sign Up</button>
      <button class="btn btn-sm btn-secondary">Demo</button>
      <button class="btn btn-sm btn-tertiary">Sign In</button>
      <button class="btn btn-sm btn-ghost" style="display:inline-flex;align-items:center;gap:6px">★ 42K</button>
    </div>
  </div>
</body>
</html>
