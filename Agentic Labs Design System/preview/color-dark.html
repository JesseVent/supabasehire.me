<!doctype html>
<html lang="en" class="theme-dark">
<head><meta charset="utf-8"><title>Dark theme</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card" style="background:var(--agl-bg)">
  <div class="col" style="gap:14px">
    <div class="label">Dark theme · slate-950 bg · slate-100 fg · accent shifts to blue-400 for AA contrast</div>
    <div class="row" style="gap:10px">
      <div style="background:var(--agl-surface);border-radius:var(--radius-md);padding:18px 20px;min-width:220px">
        <div class="eyebrow" style="margin-bottom:10px;color:var(--agl-fg-muted)">Trace · t-001</div>
        <div style="font-family:var(--font-display);font-size:30px;font-stretch:80%;line-height:1.05;color:var(--agl-fg);font-weight:600">Debug AI<br>fast.</div>
        <p style="margin:10px 0 14px;color:var(--agl-fg-muted);font-size:13px;line-height:1.5;max-width:200px">Plug in OpenTelemetry, see the agent's process unfold.</p>
        <div style="display:flex;gap:8px">
          <button style="background:var(--agl-accent);color:var(--agl-on-accent);border:none;padding:8px 14px;border-radius:8px;font-family:var(--font-sans);font-size:13px;font-weight:500">Sign Up</button>
          <button style="background:transparent;color:var(--agl-fg-muted);border:none;padding:8px 14px;border-radius:8px;font-family:var(--font-sans);font-size:13px;font-weight:500;box-shadow:inset 0 0 0 1px var(--agl-border-strong)">Docs ↗</button>
        </div>
      </div>
      <div style="background:var(--agl-code-bg);border-radius:var(--radius-md);padding:16px 18px;font-family:var(--font-mono);font-size:12.5px;line-height:1.65;color:var(--agl-code-fg);min-width:280px">
<span style="color:var(--agl-code-comment)"># install</span><br>
<span style="color:var(--agl-code-key)">npm</span> install @agentic-labs/sdk<br>
<br>
<span style="color:var(--agl-code-comment)"># run</span><br>
agl run \<br>
&nbsp;&nbsp;--traces=<span style="color:var(--agl-code-string)">"./otel.jsonl"</span> \<br>
&nbsp;&nbsp;--filter=<span style="color:var(--agl-code-string)">"err"</span>
      </div>
    </div>
    <div class="row" style="gap:6px">
      <span style="background:color-mix(in oklch, var(--purple-400) 22%, transparent);color:var(--purple-400);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px">LLM</span>
      <span style="background:color-mix(in oklch, var(--orange-400) 22%, transparent);color:var(--orange-400);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px">TOOL</span>
      <span style="background:color-mix(in oklch, var(--emerald-400) 22%, transparent);color:var(--emerald-400);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px">200 OK</span>
      <span style="background:color-mix(in oklch, var(--red-400) 22%, transparent);color:var(--red-400);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px">500</span>
      <span style="background:color-mix(in oklch, var(--blue-400) 22%, transparent);color:var(--blue-400);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px">$0.042</span>
    </div>
  </div>
</body>
</html>
