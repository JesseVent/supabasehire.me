<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card" style="background:var(--agl-surface)">
  <div class="col" style="gap:8px">
    <div class="label">Elevation · prefer hairlines over shadows</div>
    <div class="row" style="gap:18px;padding:14px 0 4px">
      <div class="col" style="gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--agl-fg-muted)">
        <div style="width:96px;height:64px;background:var(--agl-bg);border-radius:var(--radius-md);box-shadow:var(--shadow-hairline)"></div>
        <span>hairline</span>
      </div>
      <div class="col" style="gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--agl-fg-muted)">
        <div style="width:96px;height:64px;background:var(--agl-bg);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div>
        <span>sm</span>
      </div>
      <div class="col" style="gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--agl-fg-muted)">
        <div style="width:96px;height:64px;background:var(--agl-bg);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div>
        <span>md</span>
      </div>
      <div class="col" style="gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--agl-fg-muted)">
        <div style="width:96px;height:64px;background:var(--agl-bg);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div>
        <span>lg</span>
      </div>
      <div class="col" style="gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--agl-fg-muted)">
        <div style="width:96px;height:64px;background:var(--agl-bg);border-radius:var(--radius-md);box-shadow:var(--shadow-glow);border:1px solid var(--agl-accent)"></div>
        <span>focus glow</span>
      </div>
    </div>
  </div>
</body>
</html>
