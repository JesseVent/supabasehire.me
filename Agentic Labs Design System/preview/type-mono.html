<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mono &amp; code</title>
<link rel="stylesheet" href="_preview.css"></head>
<body class="card">
  <div class="col" style="gap:14px">
    <div class="label">JetBrains Mono (Martian Mono substitute) · code blocks, eyebrows, badges</div>
    <pre style="margin:0;padding:16px;border-radius:var(--radius-md);background:var(--agl-code-bg);color:var(--agl-code-fg);font-family:var(--font-mono);font-size:13px;line-height:1.6;overflow:auto">
<span style="color:var(--agl-code-comment)"># Install the palette</span>
<span style="color:var(--agl-code-key)">npm</span> install @evilmartians/harmony

<span style="color:var(--agl-code-comment)"># Use it</span>
<span style="color:var(--agl-code-key)">@import</span> <span style="color:var(--agl-code-string)">"@evilmartians/harmony/css/blue.css"</span>;
h1 { color: <span style="color:var(--agl-code-key)">var</span>(--blue-<span style="color:var(--agl-code-number)">600</span>); }</pre>
    <div style="display:flex;gap:12px;align-items:center">
      <code>--agl-accent</code>
      <code>npx degit evilmartians/agent-prism</code>
      <code>p3</code>
    </div>
  </div>
</body>
</html>
