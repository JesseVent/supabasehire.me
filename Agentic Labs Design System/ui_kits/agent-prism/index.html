<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agentic Labs · Prism · Trace Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../../assets/agentic-labs-mark.svg" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="app.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" src="mockData.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="TraceList.jsx"></script>
  <script type="text/babel" src="TreeView.jsx"></script>
  <script type="text/babel" src="DetailsView.jsx"></script>

  <script type="text/babel">
    function App() {
      const [selectedTrace, setSelectedTrace] = React.useState(AGL_TRACES[0]);
      const [selectedSpan,  setSelectedSpan]  = React.useState(AGL_SPANS[0].children[1]); // start on the LLM call
      const [traceListExpanded, setTraceListExpanded] = React.useState(true);
      const [dark, setDark] = React.useState(false);

      React.useEffect(() => {
        document.documentElement.classList.toggle("theme-dark", dark);
      }, [dark]);

      return (
        <div className="app" data-screen-label="01 Trace Viewer">
          <Header dark={dark} onToggleTheme={() => setDark(!dark)} />
          <div className="app-body">
            <TraceList
              traces={AGL_TRACES}
              selectedId={selectedTrace?.id}
              onSelect={(t) => {
                setSelectedTrace(t);
                // for the demo, only the first trace has its tree mocked
                setSelectedSpan(t.id === "t-001" ? AGL_SPANS[0].children[1] : AGL_SPANS[0]);
              }}
              expanded={traceListExpanded}
              onToggleExpand={setTraceListExpanded}
            />
            <TreeView
              spans={AGL_SPANS}
              selectedSpan={selectedSpan}
              onSelect={setSelectedSpan}
            />
            <DetailsView span={selectedSpan} />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
